<!-- DON'T EDIT THIS FILE! It is generated from foodticket.conf.in, edit that one, or the variables in Makefile.options -->
<ocsigen>
  <server>
    <port>8080</port>
    
    <logdir>local/var/log/foodticket</logdir>
    <datadir>local/var/data/foodticket</datadir>
    <charset>utf-8</charset>
    
    <commandpipe>local/var/run/foodticket-cmd</commandpipe>
    <extension findlib-package="ocsigenserver.ext.staticmod"/>
    <extension findlib-package="ocsipersist-dbm-config"/>
    <extension findlib-package="eliom.server">
      <ignoredgetparams regexp="utm_[a-z]*|[a-z]*clid|li_fat_id"/>
    </extension>
    <extension findlib-package="lwt_ppx" /> <extension findlib-package="js_of_ocaml-ppx_deriving_json" /> <extension findlib-package="mysql" /> <extension findlib-package="str" /> <extension findlib-package="unix" /> <extension findlib-package="letters" /> <extension findlib-package="tls-lwt" /> <extension findlib-package="letters" /> <extension findlib-package="tls-lwt" />
    <host defaulthostname="localhost" hostfilter="localhost">
      <static dir="static" />
      <static dir="local/var/www/foodticket/eliom" />
      <eliommodule module="local/lib/foodticket/foodticket.cma" />
      <eliom/>
    </host>
  </server>
</ocsigen>
